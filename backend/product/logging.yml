version: 1
formatters:
  simple:
    format: "%(asctime)s - %(levelname)-8s - %(name)s: %(message)s"
handlers:
  stdout:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  stderr:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stderr
loggers:
  pc:
    level: INFO
    handlers: [stdout]
    propagate: no
  uvicorn.access:
    level: INFO
    handlers: [stdout]
    propagate: no
  uvicorn.error:
    level: INFO
    handlers: [stderr]
    propagate: no
  multipart.multipart:
    level: ERROR
    handlers: [stderr]
    propagate: no
root:
  level: INFO
  handlers: [stdout]
